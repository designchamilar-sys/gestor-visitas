<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gestor de Visitas Comerciais</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f5f7;
      color: #202124;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 48px 36px;
      background: #ffffff;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 14px;
      font-size: 30px;
      line-height: 1.15;
    }

    p {
      margin: 0;
      color: #666666;
      font-size: 16px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <main class="card">
    <h1>Gestor de Visitas Comerciais</h1>
    <p>Portal de acesso à plataforma de gestão comercial.</p>
  </main>

</body>
</html>
