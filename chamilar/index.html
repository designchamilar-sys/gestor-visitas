<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gestor de Visitas Comerciais | Chamilar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #E31E24;
    }

    .card {
      width: 100%;
      max-width: 480px;
      padding: 48px 36px;
      background: #ffffff;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.18);
    }

    .logo {
      display: block;
      width: 100%;
      max-width: 260px;
      max-height: 100px;
      object-fit: contain;
      margin: 0 auto 34px;
    }

    h1 {
      margin: 0 0 12px;
      color: #202124;
      font-size: 28px;
      line-height: 1.2;
    }

    p {
      margin: 0 0 32px;
      color: #666666;
      font-size: 16px;
      line-height: 1.5;
    }

    .button {
      display: block;
      width: 100%;
      padding: 17px 22px;
      border-radius: 10px;
      background: #E31E24;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      letter-spacing: 0.4px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .footer {
      margin-top: 28px;
      margin-bottom: 0;
      color: #999999;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="card">

    <img
      class="logo"
      src="https://drive.google.com/thumbnail?id=1P4XkAfQiKYJWLn00XJKITjfqjEjWy3RH&sz=w1000"
      alt="Chamilar">

    <h1>Gestor de Visitas Comerciais</h1>

    <p>
      Plataforma de apoio à gestão da equipa comercial.
    </p>

    <a
      class="button"
      href="https://script.google.com/macros/s/AKfycbxFkv7D79iTUJry0b1p8GojyM1zLa5MQYUMl3pOOe4lRKSUpe_whnrXcHYoTuT20v0v/exec">
      ENTRAR NA APLICAÇÃO
    </a>

    <p class="footer">
      Chamilar, Lda
    </p>

  </main>

</body>
</html>
